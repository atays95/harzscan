<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>HarzScan – Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2" fill="#d9822b" stroke="none"/></svg></div>
      <div><h1>HarzScan · Admin</h1><p>Galerie, Labeln, Export</p></div>
    </div>
    <div id="status" class="status"><span class="dot"></span><span id="statusText">Starte …</span></div>
  </header>

  <section id="login" class="hidden">
    <div class="card">
      <h2>Anmelden</h2>
      <form id="loginForm">
        <label class="f" for="email">E-Mail</label>
        <input id="email" type="email" autocomplete="username" required>
        <label class="f" for="pw">Passwort</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit" style="margin-top:12px">Anmelden</button>
      </form>
      <p class="hint">Den Zugang legst du in Supabase unter Authentication → Users → „Add user“ an.</p>
    </div>
  </section>

  <section id="main" class="hidden">
    <div class="card">
      <div class="filters">
        <select id="fHall"><option value="">Alle Hallen</option></select>
        <select id="fPlate"><option value="">Alle Platten</option></select>
        <select id="fLabel">
          <option value="">Alle Labels</option><option value="_none">Ohne Label</option>
          <option value="harz_frisch">Harz frisch</option><option value="harz_alt">Harz alt</option>
          <option value="kein_harz">Kein Harz</option><option value="unsicher">Unsicher</option>
        </select>
      </div>
      <div class="stats" id="stats"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn sec" id="reload">Aktualisieren</button>
        <button class="btn sec" id="csv">CSV herunterladen</button>
        <button class="btn sec" id="logout">Abmelden</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden"></div>
  </section>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
